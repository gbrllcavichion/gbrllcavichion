name: Generate contribution snake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gbrllcavichion
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
